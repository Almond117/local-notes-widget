<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地便签 · 月历</title>
    <link rel="stylesheet" href="./calendar.css" />
  </head>
  <body>
    <main class="calendar-window">
      <aside class="calendar-sidebar">
        <div class="brand-mark">▣</div>
        <h1>每日计划</h1>
        <nav class="calendar-nav">
          <button class="nav-item" type="button">⌂ <span>今天</span></button>
          <button class="nav-item active" type="button">▦ <span>日历</span></button>
          <button class="nav-item" type="button">☑ <span>任务</span></button>
        </nav>
        <div class="direction-title">方向</div>
        <div class="direction-list">
          <button class="direction-filter active" type="button" data-direction="all"><i></i>全部</button>
          <button class="direction-filter" type="button" data-direction="工作"><i></i>工作</button>
          <button class="direction-filter" type="button" data-direction="创业"><i></i>创业</button>
          <button class="direction-filter" type="button" data-direction="学习"><i></i>学习</button>
        </div>
      </aside>
      <section class="calendar-main">
      <header class="calendar-header">
        <div class="calendar-drag-region"></div>
        <span class="calendar-mark">▦</span>
        <strong>月历</strong>
        <span id="taskSummary" class="task-summary"></span>
        <div class="calendar-actions">
          <button id="todayButton" type="button">今天</button>
          <button id="previousMonth" type="button" aria-label="上个月">‹</button>
          <button id="nextMonth" type="button" aria-label="下个月">›</button>
          <button id="closeCalendar" class="close-button" type="button" aria-label="关闭日历">×</button>
        </div>
      </header>
      <section class="calendar-content">
        <div class="month-heading">
          <h1 id="monthLabel"></h1>
          <span>按提醒日期归档，没有提醒的便签按创建日期归档</span>
        </div>
        <div class="weekday-row" aria-hidden="true">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="calendar-grid" aria-label="月历"><div id="calendarGrid" class="calendar-grid-inner"></div></div>
        <section id="dayDetail" class="day-detail" hidden>
          <div class="detail-heading">
            <h2 id="detailDate">添加任务</h2>
            <button id="closeDetail" type="button" aria-label="关闭每日详情">×</button>
          </div>
          <form id="detailForm" class="detail-form">
            <input id="detailInput" type="text" maxlength="120" placeholder="添加当天要做的事…" autocomplete="off" />
            <select id="detailDirection" aria-label="事项方向"><option value="工作">工作</option><option value="创业">创业</option><option value="学习">学习</option></select>
            <button type="submit" data-completed="false">待完成</button>
            <button type="submit" data-completed="true" class="completed-action">已完成</button>
          </form>
        </section>
        </section>
      </section>
      <aside class="add-panel">
        <div class="add-panel-heading"><h2>任务看板</h2><span id="boardDate" class="side-date"></span></div>
        <div class="side-rule"></div>
        <div id="boardTasks" class="board-tasks"></div>
      </aside>
    </main>
    <script src="./calendar.js"></script>
  </body>
</html>
